<ion-app>
  <ion-menu menuId="settings-menu" side="end" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Settings</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="full">
        <ion-item button (click)="navigateTo('/roles')">
          <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
          <ion-label>Roles</ion-label>
          <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
        </ion-item>

        <ion-item button (click)="navigateTo('/reports')">
          <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
          <ion-label>Analytics</ion-label>
          <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
        </ion-item>
      </ion-list>

      <ion-list lines="full">
        <ion-item button color="danger" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          <ion-label color="danger">Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-footer class="app-bottom-nav" *ngIf="!isLoginPage">
    <ion-toolbar>
      <div class="bottom-nav-links">
        <a
          *ngFor="let item of bottomNavItems"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="bottom-nav-link"
        >
          <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </ion-toolbar>
  </ion-footer>
</ion-app>
