<ion-app [class.app-has-bottom-nav]="!isLoginPage">
  <ion-menu menuId="settings-menu" side="end" contentId="main-content" type="overlay" class="app-end-menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="app-menu-content">
      <ion-list lines="none" class="settings-menu-list app-menu-section">
        <ion-item button [detail]="false" (click)="navigateTo('/dashboard')">
          <ion-icon slot="start" name="grid-outline" aria-hidden="true"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="navigateTo('/requests')">
          <ion-icon slot="start" name="git-network-outline" aria-hidden="true"></ion-icon>
          <ion-label>Requests</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="navigateTo('/users')">
          <ion-icon slot="start" name="people-circle-outline" aria-hidden="true"></ion-icon>
          <ion-label>Users</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="navigateTo('/partners')">
          <ion-icon slot="start" name="business-outline" aria-hidden="true"></ion-icon>
          <ion-label>Partners</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="navigateTo('/services')">
          <ion-icon slot="start" name="cube-outline" aria-hidden="true"></ion-icon>
          <ion-label>Services</ion-label>
        </ion-item>
        <ion-item button [detail]="false" (click)="navigateTo('/settings')">
          <ion-icon slot="start" name="settings-outline" aria-hidden="true"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-item>
      </ion-list>

      <ion-list lines="none" class="app-menu-section app-menu-logout">
        <ion-item button [detail]="false" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline" color="danger" aria-hidden="true"></ion-icon>
          <ion-label color="danger">Sign out</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-footer class="app-bottom-nav" *ngIf="!isLoginPage">
    <ion-toolbar>
      <div class="bottom-nav-links">
        <a
          *ngFor="let item of bottomNavItems"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="bottom-nav-link"
        >
          <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </ion-toolbar>
  </ion-footer>
</ion-app>
