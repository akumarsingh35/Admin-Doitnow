<ion-content [fullscreen]="true" class="login-content">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <div class="brand-mark">
          <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
        </div>
        <h1 id="login-title" class="login-title">Admin Panel</h1>
        <p class="login-subtitle">
          Sign in with Google to manage requests, partners, and services.
        </p>
      </header>

      <div class="login-actions">
        <!-- Web: official GIS button (FedCM). More reliable than One Tap prompt(). -->
        <ng-container *ngIf="!isNative">
          <div
            #googleButtonHost
            class="google-button-host"
            [class.google-button-host--busy]="loading"
            [attr.aria-busy]="loading"
          ></div>
          <div *ngIf="!buttonReady && !buttonError" class="login-button-status">
            <ion-spinner name="crescent"></ion-spinner>
            <span>Loading Google sign-in…</span>
          </div>
          <p *ngIf="buttonError" class="login-button-error" role="alert">{{ buttonError }}</p>
          <p *ngIf="loading" class="login-button-status">Signing in…</p>
        </ng-container>

        <!-- Native Capacitor -->
        <ion-button
          *ngIf="isNative"
          class="google-signin-btn"
          fill="solid"
          expand="block"
          size="large"
          type="button"
          [disabled]="loading"
          (click)="continueWithGoogleNative()"
        >
          <ion-spinner *ngIf="loading" slot="start" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!loading" name="logo-google" slot="start" aria-hidden="true"></ion-icon>
          <span>{{ loading ? 'Signing in…' : 'Continue with Google' }}</span>
        </ion-button>
      </div>

      <div *ngIf="errorMessage" class="login-alert" role="alert">
        <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        <p>{{ errorMessage }}</p>
      </div>

      <footer class="login-footer">
        <p class="login-hint">Authorized administrators only</p>
      </footer>
    </section>
  </main>
</ion-content>
